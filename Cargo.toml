[package]
name = "malevich"
version = "1.13.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal plotting: a small grammar of marks, honest axes, millions of points"
repository = "https://github.com/shergin/malevich"
license = "MIT OR Apache-2.0"
keywords = ["plot", "chart", "terminal", "ascii", "visualization"]
categories = ["visualization", "command-line-interface"]
# README screenshots live in the repo (crates.io rewrites the relative links to
# GitHub), but must not bloat the published crate.
exclude = ["examples/*.png"]

# Flagship TUI demo apps live in their own workspace member so their heavier deps
# (ratatui, ureq) never touch the published crate or its CI. Build them explicitly:
# `cargo run -p fred`, `cargo run -p sysmon`.
[workspace]
members = ["demos/fred", "demos/sysmon"]
# Keep the default build/test/lint set to malevich alone, so CI and `cargo test`
# never pull the demos' heavier deps. Build a demo explicitly with `-p`.
default-members = ["."]
resolver = "3"

[dependencies]
ratatui-core = { version = "0.1", optional = true }
ndarray = { version = "0.16", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
terminal_size = "0.4"
unicode-width = "0.2"

# Already in the tree via terminal_size; the direct dependency only reads the
# terminal's cell size in device pixels for Graphics::detect.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"], optional = true }

[features]
ndarray = ["dep:ndarray"]
pixel = ["dep:rustix"]
ratatui = ["dep:ratatui-core"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
ratatui = "0.30"
crossterm = "0.28"

[[example]]
name = "tui"
required-features = ["ratatui"]

[[example]]
name = "pixels"
required-features = ["pixel"]

[[bench]]
name = "ticks"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "pixels"
harness = false
required-features = ["pixel"]

[profile.bench]
codegen-units = 1
