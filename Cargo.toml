[package]
name = "malevich"
version = "0.10.1"
edition = "2024"
description = "Terminal plotting: a small grammar of marks, honest axes, millions of points"
repository = "https://github.com/shergin/malevich"
license = "MIT OR Apache-2.0"
keywords = ["plot", "chart", "terminal", "ascii", "visualization"]
categories = ["visualization", "command-line-interface"]

[dependencies]
ratatui-core = { version = "0.1", optional = true }
ndarray = { version = "0.16", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
terminal_size = "0.4"
unicode-width = "0.2"

[features]
ndarray = ["dep:ndarray"]
ratatui = ["dep:ratatui-core"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
ratatui = "0.30"
crossterm = "0.28"

[[example]]
name = "tui"
required-features = ["ratatui"]

[[bench]]
name = "ticks"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "alloc"
harness = false

[profile.bench]
codegen-units = 1
