[package]
name = "malevich"
version = "1.11.1"
edition = "2024"
rust-version = "1.88"
description = "Terminal plotting: a small grammar of marks, honest axes, millions of points"
repository = "https://github.com/shergin/malevich"
license = "MIT OR Apache-2.0"
keywords = ["plot", "chart", "terminal", "ascii", "visualization"]
categories = ["visualization", "command-line-interface"]

# Flagship TUI demo apps live in their own workspace member so their heavier deps
# (ratatui, ureq) never touch the published crate or its CI. Build them explicitly:
# `cargo run -p fred`, `cargo run -p sysmon`.
[workspace]
members = ["demos/fred", "demos/sysmon"]
# Keep the default build/test/lint set to malevich alone, so CI and `cargo test`
# never pull the demos' heavier deps. Build a demo explicitly with `-p`.
default-members = ["."]
resolver = "3"

[dependencies]
ratatui-core = { version = "0.1", optional = true }
ndarray = { version = "0.16", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
terminal_size = "0.4"
unicode-width = "0.2"

[features]
ndarray = ["dep:ndarray"]
ratatui = ["dep:ratatui-core"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
ratatui = "0.30"
crossterm = "0.28"

[[example]]
name = "tui"
required-features = ["ratatui"]

[[bench]]
name = "ticks"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "alloc"
harness = false

[profile.bench]
codegen-units = 1
