[package]
name = "malevich-demos"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Flagship TUI apps built on malevich — not published"

[dependencies]
malevich = { path = "..", features = ["ratatui"] }
ratatui = "0.30"
crossterm = "0.28"
# Small blocking HTTP client for live data refresh; TLS via rustls.
ureq = "2"

[[bin]]
name = "fred"
path = "src/bin/fred.rs"
